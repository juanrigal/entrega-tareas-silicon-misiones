<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Counter · Clase 14</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="tarjeta">
    <h1>Contador de caracteres</h1>

    <textarea id="texto" placeholder="Escribí acá tu texto..."></textarea>

    <button id="btn-limpiar">Limpiar</button>

    <div class="resultados">
      <div class="resultado">
        <span id="caracteres">0</span>
        <p>Caracteres</p>
      </div>

      <div class="resultado">
        <span id="palabras">0</span>
        <p>Palabras</p>
      </div>

      <div class="resultado">
        <span id="sin-espacios">0</span>
        <p>Sin espacios</p>
      </div>

      <div class="resultado">
        <span id="restan">280</span>
        <p>Restan</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
