<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tareas · TP Clase 13</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="tarjeta">
    <h1>Mi Lista de Tareas</h1>

    <div class="agregar">
      <input type="text" id="input-tarea" placeholder="Escribí una tarea...">
      <button id="btn-agregar">Agregar</button>
    </div>

    <ul id="lista-tareas"></ul>

    <p class="contador">
      Tareas pendientes: <span id="contador">0</span>
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
